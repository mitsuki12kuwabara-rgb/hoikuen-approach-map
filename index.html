<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f7a8c">
<title>保育園アプローチマップ｜世田谷・杉並</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" referrerpolicy="no-referrer">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<style>
  :root{
    --bg:#f3f6f7; --panel:#ffffff; --ink:#1f2a30; --sub:#6b7880; --line:#e1e7ea; --soft:#f2f6f7;
    --brand:#1f7a8c; --brand-d:#155866;
    --c-todo:#8f989f; --c-reco:#1ea7e1; --c-prog:#f08a24; --c-prog-d:#c9650c; --c-ng:#3d4449;
    --shadow:0 6px 24px rgba(20,40,50,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink);background:var(--bg);-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  .app{display:flex;height:100vh;height:100dvh;overflow:hidden}

  /* ===== 左パネル（スマホではボトムシート） ===== */
  .side{width:390px;min-width:390px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1200}
  .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px}
  .brand .logo{font-size:24px;line-height:1}
  .brand h1{font-size:16px;margin:0;letter-spacing:.02em}
  .brand .sub{font-size:11px;color:var(--sub);margin-top:2px}
  .hbtn{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--sub);padding:5px 10px;white-space:nowrap}
  .hbtn + .hbtn{margin-left:0}
  .syncChip{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:11.5px;font-weight:700;padding:5px 9px;white-space:nowrap;cursor:pointer;color:var(--sub)}
  .syncChip + .hbtn{margin-left:6px}
  .syncChip.s-ok{color:#1b7a46;border-color:#bfe3cc;background:#f1faf4}
  .syncChip.s-warn{color:#9a5a00;border-color:#f1d29c;background:#fff8ea}
  .syncChip.s-err{color:#b42318;border-color:#f3c0bb;background:#fff3f2}
  .syncChip.s-busy{color:var(--brand-d)}
  .kmsg{display:none;background:#fff3f2;color:#b42318;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}
  .khint{font-size:12.5px;color:var(--sub);line-height:1.6;margin:6px 0 0}
  .syncbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--soft);font-size:13px;line-height:1.7}

  /* 進捗（数字） */
  .prog{margin-top:10px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
  .prog .top{display:flex;align-items:baseline;gap:6px}
  .prog .big{font-size:24px;font-weight:800;color:var(--c-prog-d);line-height:1}
  .prog .of{font-size:12px;color:var(--sub)}
  .prog .pct{margin-left:auto;font-size:13px;font-weight:700;color:var(--brand-d)}
  .sbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#e5eaec;margin-top:7px}
  .sbar i{display:block;height:100%}
  .prog .nums{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:7px;font-size:11.5px;color:var(--sub)}
  .prog .nums b{color:var(--ink)}
  .prog .more{font-size:11px;color:var(--brand);margin-top:5px}

  .searchbar{margin-top:10px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .searchbar .ic{font-size:15px}
  .searchbar .txt{flex:1;font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .searchbar .txt.on{color:var(--ink);font-weight:700}
  .searchbar .fcount{background:var(--brand);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;display:none}
  .searchbar .clr{display:none;border:none;background:#eee;border-radius:50%;width:22px;height:22px;line-height:20px;text-align:center;color:#777;font-size:13px;padding:0}

  .tabs{display:flex;gap:6px;padding:10px 16px 0}
  .tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0;padding:9px 4px;font-size:12.5px;color:var(--sub);font-weight:700;border-bottom:none}
  .tabs button.on{color:var(--brand-d);background:var(--panel);box-shadow:inset 0 -3px 0 var(--brand)}
  .tabs button .n{font-weight:400;font-size:11px;margin-left:3px}

  .list{flex:1;overflow:auto;padding:8px 12px 24px}
  .note{font-size:11.5px;color:var(--sub);background:var(--soft);border:1px dashed #d3dde1;border-radius:8px;padding:8px 10px;margin:6px 2px 10px;line-height:1.55}
  .note b{color:var(--brand-d)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .card:hover{border-color:#c6d3d8}
  .card.active{border-color:var(--brand);box-shadow:0 2px 12px rgba(31,122,140,.18)}
  .cdot{flex:none;width:26px;height:26px;border-radius:50%;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
  .cmain{flex:1;min-width:0}
  .cname{font-size:14px;font-weight:700;line-height:1.35}
  .cmeta{font-size:11.5px;color:var(--sub);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .chip{background:#eef3f5;border-radius:5px;padding:1px 6px;color:#4f5d64}
  .stg{border-radius:5px;padding:1px 7px;color:#fff;font-weight:700}
  .prio{border-radius:5px;padding:1px 6px;font-weight:700;color:#0b6c96;background:#d8f1fc}
  .ctel{flex:none;align-self:center;border:1px solid #cfe3e8;background:#f2fafb;border-radius:10px;width:42px;height:42px;font-size:18px;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .moreBtn{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:13px;color:var(--brand-d);margin:4px 0 10px}

  /* ===== 地図 ===== */
  .mapwrap{flex:1;position:relative}
  #map{position:absolute;inset:0;background:#e9eef0}
  .pin{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:11px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .12s}
  .pin.sel{transform:scale(1.45);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--brand)}
  .p-todo{background:rgba(143,152,159,.5);border-color:rgba(255,255,255,.8)}
  .p-reco1{background:rgba(30,167,225,.42)}
  .p-reco2{background:rgba(30,167,225,.62)}
  .p-reco3{background:rgba(30,167,225,.85)}
  .p-prog{background:var(--c-prog)}
  .p-prog.deep{background:var(--c-prog-d)}
  .p-ng{background:rgba(61,68,73,.55);border-color:rgba(255,255,255,.7)}
  .legend{position:absolute;right:12px;bottom:26px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);z-index:800;min-width:170px}
  .legend h4{margin:0 0 6px;font-size:12px}
  .legend .row{display:flex;align-items:center;gap:7px;margin-top:5px;color:#47545b}
  .legend .row i{width:16px;height:16px;border-radius:50%;flex:none;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);font-style:normal;font-size:9px;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
  .fab{position:absolute;z-index:801;background:#fff;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;box-shadow:var(--shadow);font-size:18px;display:flex;align-items:center;justify-content:center}
  .fab.on{background:var(--brand);color:#fff}
  #fabLoc{right:12px;top:12px}
  #legToggle{right:12px;top:64px;display:none}
  .umk{width:18px;height:18px;border-radius:50%;background:#2a7de1;border:3px solid #fff;box-shadow:0 0 0 2px rgba(42,125,225,.35),0 1px 4px rgba(0,0,0,.3)}

  /* ===== 詳細 ===== */
  .detail{position:absolute;top:0;right:0;width:420px;max-width:48%;height:100%;background:var(--panel);box-shadow:-8px 0 24px rgba(0,0,0,.12);transform:translateX(105%);visibility:hidden;pointer-events:none;transition:transform .24s cubic-bezier(.3,.7,.3,1),visibility 0s .24s;z-index:1300;display:flex;flex-direction:column}
  .detail.open{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .24s cubic-bezier(.3,.7,.3,1),visibility 0s 0s}
  .dhead{padding:14px 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
  .dhead .dclose{margin-left:auto;border:none;background:#eef3f5;border-radius:50%;width:36px;height:36px;font-size:18px;color:#56656c;flex:none}
  .dtitle{font-size:18px;font-weight:800;line-height:1.3}
  .dcat{font-size:12px;color:var(--sub);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .dbody{flex:1;overflow:auto;padding:14px 16px 40px}
  .block{margin-top:16px}
  .block:first-child{margin-top:0}
  .block h3{font-size:12.5px;color:var(--brand-d);margin:0 0 8px;letter-spacing:.03em}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .abtn{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;border-radius:12px;padding:13px 8px;font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid var(--brand);color:var(--brand-d);background:#fff;min-height:50px}
  .abtn.tel{background:var(--brand);color:#fff;grid-column:1 / -1;font-size:17px;min-height:56px}
  .abtn.dis{opacity:.45;pointer-events:none}
  .busy{font-size:12px;line-height:1.55;border-radius:10px;padding:8px 10px;margin-top:8px}
  .busy.warn{background:#fff3e6;border:1px solid #f6d2ae;color:#8a4b0f}
  .busy.ok{background:#eaf7ef;border:1px solid #c5e8d2;color:#256b43}
  .kv{font-size:13.5px;line-height:1.65;margin:0}
  .kv dt{color:var(--sub);font-size:11.5px;margin-top:7px}
  .kv dd{margin:0}
  .kv a{color:#1f6db5}
  .warn2{color:#8a6a12;background:#fbf4dd;border-radius:6px;padding:4px 8px;font-size:12px;display:inline-block}

  /* ステッパー */
  .stepper{display:flex;flex-direction:column;gap:5px}
  .step{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;text-align:left;font-size:14px;min-height:46px}
  .step .num{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2f4;color:#6b7880;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
  .step.done{background:#fff8f1;border-color:#f6d9bd}
  .step.done .num{background:#f6c89b;color:#fff}
  .step.cur{background:var(--c-prog);border-color:var(--c-prog);color:#fff;font-weight:800}
  .step.cur .num{background:#fff;color:var(--c-prog-d)}
  .step.ngs{margin-top:4px;border-style:dashed;color:#4e575c}
  .step.ngs.cur{background:var(--c-ng);border-color:var(--c-ng);color:#fff;border-style:solid}
  .step.ngs.cur .num{color:var(--c-ng)}
  .step.todo.cur{background:#8f989f;border-color:#8f989f}
  .step.todo.cur .num{color:#6b7880}
  .seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .seg button{flex:1;border:none;background:#fff;padding:11px 4px;font-size:14px;border-right:1px solid var(--line);min-height:46px}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--c-reco);color:#fff;font-weight:800}
  .seg button.on[data-v=""]{background:#8f989f}
  .quick{display:flex;flex-wrap:wrap;gap:6px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 13px;font-size:13px;min-height:40px}
  .quick button:active{background:var(--soft)}
  .field{margin-top:10px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;font-size:16px}
  .field textarea{min-height:90px;resize:vertical;line-height:1.55}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .f2 .field{margin-top:10px}
  .log{list-style:none;margin:0;padding:0;font-size:12.5px}
  .log li{border-left:3px solid #f3c79c;padding:4px 0 4px 9px;margin-bottom:5px;line-height:1.5}
  .log li .t{color:var(--sub);font-size:11px;display:block}
  .log li button{border:none;background:none;color:#b0b7bb;font-size:12px;padding:0 4px;float:right}
  .saved{font-size:11.5px;color:var(--sub);margin-top:8px}

  /* ===== モーダル ===== */
  .mask{position:fixed;inset:0;background:rgba(20,30,36,.45);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
  .mask.open{display:flex}
  .modal{background:var(--panel);border-radius:18px;width:100%;max-width:500px;max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .mhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2}
  .mhead h2{font-size:16px;margin:0}
  .mhead .x{margin-left:auto;border:none;background:#eef3f5;border-radius:50%;width:36px;height:36px;font-size:17px;color:#56656c}
  .mbody{padding:14px 18px;flex:1}
  .fgroup{margin-bottom:16px}
  .fgroup > label{font-size:12.5px;font-weight:700;display:block;margin-bottom:7px}
  .tinput{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 13px;font-size:16px;background:#fff}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chipbtn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 12px;font-size:13px;color:#4f5d64;min-height:38px}
  .chipbtn .c{font-size:11px;color:var(--sub);margin-left:3px}
  .chipbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .chipbtn.on .c{color:#d8eef2}
  .suggest{margin-top:6px;border:1px solid var(--line);border-radius:11px;background:#fff;display:none;max-height:240px;overflow-y:auto}
  .suggest.on{display:block}
  .srow{display:flex;align-items:center;gap:9px;padding:10px 12px;border-bottom:1px solid #eef2f4;cursor:pointer}
  .srow:last-child{border-bottom:none}
  .srow .tag{flex:none;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:2px 7px;background:#6b7a90}
  .srow .tag.f{background:var(--brand)}
  .srow .nm{flex:1;font-size:14px}
  .srow .ct{flex:none;font-size:11px;color:var(--sub)}
  .mfoot{position:sticky;bottom:0;background:var(--panel);padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
  .mfoot .reset{border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 16px;font-size:13px;color:var(--sub)}
  .mfoot .go{flex:1;border:none;background:var(--brand);color:#fff;border-radius:11px;padding:13px;font-size:15px;font-weight:700}
  .statline{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
  .statline .lab{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .statline .sbar{flex:1;margin-top:0;height:10px}
  .statline .val{width:128px;flex:none;text-align:right;color:var(--sub);font-size:12px;white-space:nowrap}
  .statline .val b{color:var(--ink)}
  .statline.click{cursor:pointer}
  .bignums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .bignums div{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
  .bignums b{display:block;font-size:22px;color:var(--c-prog-d)}
  .bignums span{font-size:11px;color:var(--sub)}
  .info p{font-size:13px;line-height:1.7;color:#3c484e;margin:6px 0}
  .info h3{font-size:13px;margin:16px 0 4px;color:var(--brand-d)}
  .info a{color:#1f6db5;word-break:break-all}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .btnrow button,.btnrow label{border:1px solid var(--brand);background:#fff;color:var(--brand-d);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:rgba(28,38,44,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:3000;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ===== スマホ ===== */
  .sheetHandle{display:none}
  @media (max-width:820px){
    .app{flex-direction:column}
    .side{width:100%;min-width:0;position:fixed;left:0;right:0;bottom:0;top:auto;height:46vh;display:block;overflow-y:auto;overscroll-behavior:contain;border-right:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);padding-bottom:env(safe-area-inset-bottom)}
    .mapwrap{position:fixed;inset:0}
    .sheetHandle{display:block;padding:8px 0 3px;text-align:center;touch-action:none;cursor:grab;position:sticky;top:0;z-index:9;background:var(--panel);border-radius:18px 18px 0 0}
    .sheetHandle .grip{display:inline-block;width:44px;height:5px;border-radius:3px;background:#cfd8dc}
    .head{display:contents}
    .brand{position:sticky;top:var(--stH,24px);z-index:8;background:var(--panel);margin:0;padding:2px 14px 8px;border-bottom:1px solid var(--line)}
    .brand .sub{display:none}
    .brand .logo{font-size:20px}
    .brand h1{font-size:15px}
    .headExtra{padding:8px 14px 2px}
    .prog{margin-top:0}
    .tabs{position:sticky;top:var(--stB,64px);z-index:8;background:var(--panel);margin:0;padding:8px 12px 6px}
    .list{overflow:visible;padding:8px 10px 30px}
    #legToggle{display:flex}
    .legend{display:none;top:116px;bottom:auto}
    .legend.open{display:block}
    .detail{position:fixed;inset:0;width:100%;max-width:100%;z-index:1600;transform:translateY(100%);transition:transform .24s,visibility 0s .24s;padding-bottom:env(safe-area-inset-bottom)}
    .detail.open{transform:translateY(0)}
    body.detail-open .side{visibility:hidden;pointer-events:none}
    body.detail-open .fab{display:none}
    .hbtn{padding:5px 9px}
    .statline .lab{width:88px}
    .statline .val{width:112px;font-size:11.5px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="sheetHandle" id="sheetHandle"><span class="grip"></span></div>
    <div class="head">
      <div class="brand">
        <span class="logo">🏫</span>
        <div>
          <h1>保育園アプローチマップ</h1>
          <div class="sub">世田谷区・杉並区｜テレアポ〜モニター獲得の進捗</div>
        </div>
        <button class="syncChip" id="syncChip" title="チームで共有（Googleスプレッドシート）"></button>
        <button class="hbtn" id="infoBtn" title="使い方・記録の保存">ⓘ</button>
      </div>
      <div class="headExtra">
        <div class="prog" id="progBox" title="タップで内訳"></div>
        <div class="searchbar" id="searchBar">
          <span class="ic">🔍</span>
          <span class="txt" id="searchTxt">名前・町名・状態でしぼり込む</span>
          <span class="fcount" id="fcount"></span>
          <button class="clr" id="searchClr" aria-label="条件をクリア">×</button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <button id="tab-next" data-tab="next">次に着手<span class="n" id="n-next"></span></button>
      <button id="tab-prog" data-tab="prog">進行中<span class="n" id="n-prog"></span></button>
      <button id="tab-all" data-tab="all">すべて<span class="n" id="n-all"></span></button>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <div class="mapwrap">
    <div id="map"></div>
    <button class="fab" id="fabLoc" title="現在地">📍</button>
    <button class="fab" id="legToggle" title="色の見方">🎨</button>
    <div class="legend" id="legend">
      <h4>ピンの色</h4>

      <div class="row"><i style="background:rgba(30,167,225,.42)"></i>推奨 低</div>
      <div class="row"><i style="background:rgba(143,152,159,.5)"></i>未着手</div>
      <div class="row"><i style="background:rgba(61,68,73,.55)"></i>連絡済み・ダメだった</div>
    </div>
  </div>

  <aside class="detail" id="detail">
    <div class="dhead">

<!-- 合言葉（チーム共有） -->
<div class="mask" id="kMask">
  <div class="modal">

    <div class="mbody">
      <div class="kmsg" id="kMsg"></div>

        <input class="tinput" id="kName" type="text" placeholder="例）桑原" autocomplete="name"></div>
      <div class="fgroup"><label>チームの合言葉</label>
        <input class="tinput" id="kKey" type="password" placeholder="チームで決めた合言葉" autocomplete="current-password"></div>
      <p class="khint">記録はチームのGoogleスプレッドシートに保存され、全員の地図に反映されます。合言葉はこの端末に覚えておくので、入れるのは最初の一度だけです。電波が悪いときは端末にいったん保存し、つながったらまとめて送ります。</p>
    </div>
    <div class="mfoot">
      <button class="reset" id="kLocal">この端末だけで使う</button>
      <button class="go" id="kGo">つなぐ</button>
    </div>
  </div>

<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" referrerpolicy="no-referrer"></script>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
<script src="landmarks.js"></script>
<script src="basemap.js"></script>
<script src="data.js"></script>
<script src="sync-config.js"></script>
<script>
(function(){
"use strict";
var D=window.HOIKU_DATA, F=D.facilities, META=D.meta;
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ========== 段階 ========== */
var STAGES=[
  {id:"todo",      label:"未着手",               short:"未着手", step:0},
  {id:"tel",       label:"テレアポ",             short:"テレアポ", step:1},
  {id:"fax",       label:"FAX・メール",          short:"FAX・メール", step:2},
  {id:"sched",     label:"日程調整",             short:"日程調整", step:3},
  {id:"interview", label:"インタビュー",         short:"インタビュー", step:4},
  {id:"survey",    label:"アンケート",           short:"アンケート", step:5},
  {id:"ongoing",   label:"継続的関係（モニター獲得）", short:"継続・モニター", step:6},
  {id:"ng",        label:"連絡済み・ダメだった",  short:"ダメだった", step:-1}
];
var MAXSTEP=6, SMAP={}; STAGES.forEach(function(s){SMAP[s.id]=s;});
var PIPE=STAGES.filter(function(s){return s.step>=1;});
var STAGE_COLOR=function(s){ if(s.id==="ng")return "#3d4449"; if(s.id==="todo")return "#8f989f"; return s.step>=5?"#c9650c":"#f08a24"; };
var PRIO={"3":"高","2":"中","1":"低"};

/* ========== 記録（この端末のブラウザに保存） ========== */
var LSKEY="hoiku_approach_records_v1", REC={};
try{ REC=JSON.parse(localStorage.getItem(LSKEY)||"{}")||{}; }catch(e){ REC={}; }
function saveREC(){ try{ localStorage.setItem(LSKEY, JSON.stringify(REC)); return true; }catch(e){ toast("保存できませんでした（ブラウザの設定をご確認ください）"); return false; } }
/* チーム共有（Googleスプレッドシート）。URLは sync-config.js、合言葉と名前は端末ごとに保存 */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var SYNC={
  url:(window.HOIKU_SYNC_URL||"").trim(),
  key:lsGet("hoiku_sync_key")||"", name:lsGet("hoiku_sync_name")||"",
  local:lsGet("hoiku_sync_local")==="1",        // 「この端末だけで使う」を選んだ
  pending:{}, state:"off", lastOk:lsGet("hoiku_sync_last")||"", busy:false, err:""
};
try{ SYNC.pending=JSON.parse(lsGet("hoiku_pending_v1")||"{}")||{}; }catch(e){ SYNC.pending={}; }
var FMAP={}; F.forEach(function(f){FMAP[f.id]=f;});
function recOf(id){ var r=REC[id]; if(r) return r; var f=FMAP[id]; return (f&&f.seed)?f.seed:{status:"todo"}; }
function stageOf(id){ var s=recOf(id).status; return SMAP[s]?s:"todo"; }
function prioOf(id){ return String(recOf(id).prio||""); }
function telOf(f){ return recOf(f.id).tel || f.tel || ""; }
// 表示グループ： prog=進行中 / reco=推奨（未着手＋推奨度あり） / todo=未着手 / ng=ダメだった
function groupOf(id){ var s=stageOf(id); if(s==="ng")return "ng"; if(s!=="todo")return "prog"; return prioOf(id)?"reco":"todo"; }
function now(){ var d=new Date(); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function editRec(id, fn){
  var r=REC[id] ? REC[id] : JSON.parse(JSON.stringify(recOf(id)));
  fn(r);
  r.updatedAt=now(); r.ts=Date.now();
  if(SYNC.name) r.by=SYNC.name;
  REC[id]=r; saveREC();
  markPending(id);
  refreshOne(id);
  return r;
}

/* ========== 地図 ========== */
var map=L.map('map',{zoomControl:true}).setView([35.672,139.630],13);
map.zoomControl.setPosition('bottomleft');
/* 地図の見え方 3段階（すっきり → 目安 → 標準）。政治家ICTの地図と同じ。basemap.js */
var basemap=addHoikuBasemap(map,{initialMode:"landmark",position:"topleft"});
var markers={}, layer=L.layerGroup().addTo(map), userMarker=null, userLoc=null, activeId=null;
function pinClass(id){
  var g=groupOf(id), s=SMAP[stageOf(id)];
  if(g==="prog") return "p-prog"+(s.step>=5?" deep":"");
  if(g==="reco") return "p-reco"+prioOf(id);
  return "p-"+g;
}
function pinSize(id){ var g=groupOf(id); if(g==="prog")return 24; if(g==="reco")return prioOf(id)==="3"?22:(prioOf(id)==="2"?19:17); return 14; }
function iconFor(id){
  var g=groupOf(id), s=SMAP[stageOf(id)], sz=pinSize(id);
  var txt=g==="prog"?s.step:(g==="reco"?PRIO[prioOf(id)]:"");
  return L.divIcon({className:"",iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],
    html:'<div class="pin '+pinClass(id)+(id===activeId?' sel':'')+'" style="font-size:'+(sz>20?11:9)+'px">'+txt+'</div>'});
}
function zOf(id){ var g=groupOf(id); return g==="prog"?900:(g==="reco"?600+(+prioOf(id))*50:(g==="todo"?200:0)); }
F.forEach(function(f){
  var m=L.marker([f.lat,f.lng],{icon:iconFor(f.id),zIndexOffset:zOf(f.id),keyboard:false,title:f.name});
  m.on('click',function(){ openDetail(f.id,false); });
  markers[f.id]=m;
});

/* ========== 状態・絞り込み ========== */
var KINDS=[]; F.forEach(function(f){ if(f.kind && KINDS.indexOf(f.kind)<0) KINDS.push(f.kind); });
var KIND_ORDER=["区立","私立","小規模","認定こども園","家庭的保育","事業所内"];
KINDS.sort(function(a,b){return (KIND_ORDER.indexOf(a)+99)%99-(KIND_ORDER.indexOf(b)+99)%99;});
var REGIONS=["世田谷","北沢","玉川","砧","烏山"];
var TOWN_COUNT={}; F.forEach(function(f){ if(f.town) TOWN_COUNT[f.town]=(TOWN_COUNT[f.town]||0)+1; });
var TOWNS=Object.keys(TOWN_COUNT).sort(function(a,b){return TOWN_COUNT[b]-TOWN_COUNT[a];});
var state={tab:"next", q:"", ku:{}, region:{}, group:{}, stage:{}, prio:{}, kind:{}, dist:0, telOnly:false, dueOnly:false};
var SHOW_N=80, shown=SHOW_N;
function setSize(o){return Object.keys(o).filter(function(k){return o[k];}).length;}
function passFilter(f){
  var r=recOf(f.id);
  if(setSize(state.ku) && !state.ku[f.ku]) return false;
  if(setSize(state.region) && !state.region[f.region]) return false;
  if(setSize(state.group) && !state.group[groupOf(f.id)]) return false;
  if(setSize(state.stage) && !state.stage[stageOf(f.id)]) return false;
  if(setSize(state.prio) && !state.prio[prioOf(f.id)||"0"]) return false;
  if(setSize(state.kind) && !state.kind[f.kind]) return false;
  if(state.telOnly && !telOf(f)) return false;
  if(state.dueOnly && !(r.nextDate && r.nextDate<=today())) return false;
  if(state.dist && userLoc && distM(userLoc,f)>state.dist) return false;
  if(state.q){
    var q=state.q.toLowerCase();
    var hay=(f.name+" "+f.addr+" "+(f.town||"")+" "+(r.memo||"")+" "+(r.staff||"")).toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function filterCount(){ return (state.q?1:0)+setSize(state.ku)+setSize(state.region)+setSize(state.group)+setSize(state.stage)+setSize(state.prio)+setSize(state.kind)+(state.dist?1:0)+(state.telOnly?1:0)+(state.dueOnly?1:0); }
function distM(a,b){ var R=6371000,t=Math.PI/180,dLat=(b.lat-a.lat)*t,dLng=(b.lng-a.lng)*t; var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)*Math.sin(dLng/2); return 2*R*Math.asin(Math.sqrt(h)); }
function fmtDist(m){ return m<1000?(Math.round(m/10)*10)+"m":(m/1000).toFixed(1)+"km"; }

/* ========== 描画 ========== */
function stageChip(id){
  var s=SMAP[stageOf(id)];
  if(s.id==="todo") return '<span class="stg" style="background:#8f989f">未着手</span>';
  if(s.id==="ng") return '<span class="stg" style="background:#3d4449">ダメだった</span>';
  return '<span class="stg" style="background:'+STAGE_COLOR(s)+'">'+s.step+'/'+MAXSTEP+' '+esc(s.short)+'</span>';
}
function prioChip(id){ var p=prioOf(id); return p?'<span class="prio">推奨 '+PRIO[p]+'</span>':''; }
function dotHTML(id){
  var g=groupOf(id), s=SMAP[stageOf(id)], bg;
  if(g==="prog") bg=STAGE_COLOR(s); else if(g==="reco") bg="rgba(30,167,225,"+({"1":.5,"2":.7,"3":.95})[prioOf(id)]+")"; else if(g==="ng") bg="rgba(61,68,73,.7)"; else bg="rgba(143,152,159,.6)";
  var t=g==="prog"?s.step:(g==="reco"?PRIO[prioOf(id)]:(g==="ng"?"×":""));
  return '<span class="cdot" style="background:'+bg+'">'+t+'</span>';
}
function cardHTML(f){
  var r=recOf(f.id), tel=telOf(f);
  var meta='<span class="chip">'+esc(f.kind||"")+'</span><span>📍'+esc(f.ku.replace("区",""))+(f.region?"・"+esc(f.region):"")+" "+esc(f.town||"")+'</span>';
  if(userLoc) meta+='<span>'+fmtDist(distM(userLoc,f))+'</span>';
  var sub='';
  if(r.nextDate) sub+='<span style="color:'+(r.nextDate<=today()?'#c0392b':'var(--sub)')+'">⏰ 次回 '+esc(r.nextDate.slice(5).replace("-","/"))+'</span>';
  return '<div class="card'+(f.id===activeId?' active':'')+'" data-id="'+f.id+'">'+dotHTML(f.id)+
    '<div class="cmain"><div class="cname">'+esc(f.name)+'</div><div class="cmeta">'+stageChip(f.id)+prioChip(f.id)+meta+sub+'</div></div>'+
    (tel?'<a class="ctel" href="tel:'+tel.replace(/[^0-9]/g,"")+'" data-tel="'+f.id+'" title="電話をかける">📞</a>':'')+'</div>';
}
function sortList(arr){
  var gOrd={prog:0,reco:1,todo:2,ng:3};
  arr.sort(function(a,b){
    if(state.tab==="next"){ var d=(+prioOf(b.id))-(+prioOf(a.id)); if(d) return d; }
    if(state.tab==="prog"){
      var ra=recOf(a.id), rb=recOf(b.id);
      var na=ra.nextDate||"9999", nb=rb.nextDate||"9999"; if(na!==nb) return na<nb?-1:1;
      var sd=SMAP[stageOf(b.id)].step-SMAP[stageOf(a.id)].step; if(sd) return sd;
    }
    if(state.tab==="all"){ var g=gOrd[groupOf(a.id)]-gOrd[groupOf(b.id)]; if(g) return g; if(groupOf(a.id)==="reco"){var p=(+prioOf(b.id))-(+prioOf(a.id)); if(p) return p;} }
    if(userLoc) return distM(userLoc,a)-distM(userLoc,b);
    return a.addr<b.addr?-1:(a.addr>b.addr?1:0);
  });
  return arr;
}
function tabList(tab){
  return F.filter(function(f){
    if(!passFilter(f)) return false;
    var g=groupOf(f.id);
    if(tab==="next") return g==="reco";
    if(tab==="prog") return g==="prog";
    return true;
  });
}
function render(){
  ["next","prog","all"].forEach(function(t){ $('tab-'+t).classList.toggle('on',state.tab===t); $('n-'+t).textContent=tabList(t).length; });
  var arr=sortList(tabList(state.tab)), list=$('list'), head="";
  var fc=filterCount();
  if(state.tab==="next"){
    head='<div class="note">推奨度（<b>高・中・低</b>）をつけた<b>未着手</b>の園です。推奨度は各園の詳細で自分で設定できます。'+(arr.length?'':'<br>まだありません。「すべて」から園を開き、推奨度を選んでください。')+'</div>';
  }else if(state.tab==="prog"){
    head='<div class="note">テレアポ以降に進んでいる園（<b>'+arr.length+'</b>件）。次回予定日が近い順です。</div>';
  }else{
    head='<div class="note">'+(fc?'条件に合う':'全')+' <b>'+arr.length+'</b> 件（進行中 → 推奨 → 未着手 → ダメだった'+(userLoc?'、近い順':'')+'）</div>';
  }
  var html=head+arr.slice(0,shown).map(cardHTML).join('');
  if(arr.length>shown) html+='<button class="moreBtn" id="moreBtn">さらに表示（残り '+(arr.length-shown)+' 件）</button>';
  list.innerHTML=html;
  var mb=$('moreBtn'); if(mb) mb.addEventListener('click',function(){ shown+=SHOW_N; render(); });
  // 地図（絞り込みに連動）
  layer.clearLayers();
  F.forEach(function(f){ if(passFilter(f)) layer.addLayer(markers[f.id]); });
  updateProgress(); updateSearchBar();
}
$('list').addEventListener('click',function(e){
  var t=e.target.closest('[data-tel]');
  if(t){ e.stopPropagation(); afterCall(t.getAttribute('data-tel')); return; }
  var c=e.target.closest('.card'); if(c) openDetail(c.getAttribute('data-id'),true);
});
function refreshOne(id){
  var m=markers[id]; if(m){ m.setIcon(iconFor(id)); m.setZIndexOffset(zOf(id)); }
  render();
}

/* ========== 進捗（数字） ========== */
function counts(list){ var c={}; STAGES.forEach(function(s){c[s.id]=0;}); var reco=0; list.forEach(function(f){ c[stageOf(f.id)]++; if(groupOf(f.id)==="reco") reco++; }); c.reco=reco; return c; }
function stackBar(c,total){
  if(!total) return '<div class="sbar"></div>';
  var parts=PIPE.slice().reverse().map(function(s){ var n=c[s.id]; return n?'<i style="width:'+(n/total*100)+'%;background:'+STAGE_COLOR(s)+'" title="'+esc(s.label)+' '+n+'"></i>':''; }).join('');
  parts+=c.reco?'<i style="width:'+(c.reco/total*100)+'%;background:rgba(30,167,225,.7)"></i>':'';
  parts+=c.ng?'<i style="width:'+(c.ng/total*100)+'%;background:rgba(61,68,73,.6)"></i>':'';
  return '<div class="sbar">'+parts+'</div>';
}
function reached(list,step){ return list.filter(function(f){ return SMAP[stageOf(f.id)].step>=step; }).length; }
function updateProgress(){
  var c=counts(F), total=F.length, started=total-c.todo;
  var prog=PIPE.reduce(function(a,s){return a+c[s.id];},0);
  var pct=Math.round(started/total*1000)/10;
  $('progBox').innerHTML='<div class="top"><span class="big">'+started+'</span><span class="of">/ '+total+' 園 に連絡済み</span><span class="pct">'+pct+'%</span></div>'+
    stackBar(c,total)+
    '<div class="nums"><span>進行中 <b>'+prog+'</b></span><span>インタビュー以上 <b>'+reached(F,4)+'</b></span><span>モニター <b>'+c.ongoing+'</b></span><span>推奨 <b>'+c.reco+'</b></span><span>ダメ <b>'+c.ng+'</b></span></div>'+
    '<div class="more">▶ タップで段階ごとの内訳</div>';
}
function renderSummary(){
  var c=counts(F), total=F.length, started=total-c.todo;
  var h='<div class="bignums"><div><b>'+started+'</b><span>連絡済み / '+total+'</span></div><div><b>'+reached(F,4)+'</b><span>インタビュー以上</span></div><div><b>'+c.ongoing+'</b><span>モニター獲得</span></div></div>';
  h+='<h3 style="font-size:13px;margin:6px 0">到達した段階（その段階まで進んだ園の数）</h3>';
  PIPE.forEach(function(s){ var r=reached(F,s.step);
    h+='<div class="statline click" data-stage="'+s.id+'"><span class="lab">'+s.step+'. '+esc(s.short)+'</span><div class="sbar"><i style="width:'+(r/Math.max(1,started)*100)+'%;background:'+STAGE_COLOR(s)+'"></i></div><span class="val"><b>'+r+'</b> 園（今ここ '+c[s.id]+'）</span></div>'; });
  h+='<div class="statline click" data-stage="ng"><span class="lab">× ダメだった</span><div class="sbar"><i style="width:'+(c.ng/Math.max(1,started)*100)+'%;background:#3d4449"></i></div><span class="val"><b>'+c.ng+'</b> 園</span></div>';

function busyNote(){
  var d=new Date(), m=d.getHours()*60+d.getMinutes(), day=d.getDay();
  var busy=[[450,570,"登園対応"],[690,780,"昼食"],[960,1110,"降園対応"]], good=[[600,660],[810,930]];
  if(day===0) return '<div class="busy warn">今日は日曜日です。多くの園はお休みです。</div>';
  for(var i=0;i<busy.length;i++) if(m>=busy[i][0]&&m<busy[i][1]) return '<div class="busy warn">⚠ いまは園が忙しい時間帯です（'+busy[i][2]+'）。おすすめは <b>10:00〜11:00</b>／<b>13:30〜15:30</b>。</div>';
  for(var j=0;j<good.length;j++) if(m>=good[j][0]&&m<good[j][1]) return '<div class="busy ok">◎ いまは電話に比較的良い時間帯です。最初に「今お時間よろしいでしょうか？」を。</div>';
  return '<div class="busy ok" style="background:#f2f6f7;border-color:var(--line);color:var(--sub)">電話に良い時間帯：10:00〜11:00／13:30〜15:30（避ける：7:30〜9:30・11:30〜13:00・16:00〜18:30）</div>';
}

function syncInfoHTML(){

function download(name,text,type){

function csvCell(v){ v=(v==null?"":String(v)); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

  });

function exportJson(){ download("保育園アプローチ記録_"+stamp()+".json",JSON.stringify({app:"hoikuen-approach-map",version:1,exportedAt:now(),records:REC},null,1),"application/json"); toast("JSONを保存しました"); }
$('importFile').addEventListener('change',function(){
  var file=this.files[0]; if(!file) return; var rd=new FileReader();
  rd.onload=function(){

        if(!cur){ REC[id]=x; add++; markPending(id,true); } else if((x.ts||0)>(cur.ts||0)){ REC[id]=x; upd++; markPending(id,true); } else keep++;
      });

function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2600); }

/* ========== チーム共有（Googleスプレッドシート） ==========
 * ・記録するとまず端末に保存し、つながっていればスプレッドシートへ送る（電波が悪いときは「未送信」として貯めておき、つながったらまとめて送る）
 * ・同じ園を同時に記録したら、更新時刻が新しいほうが残る
 * ・開いたとき／画面に戻ったとき／90秒ごとに、ほかの人の記録を取り込む
 */
function syncOn(){ return !!(SYNC.url && SYNC.key && !SYNC.local); }
function pendingIds(){ return Object.keys(SYNC.pending); }
function savePending(){ lsSet("hoiku_pending_v1",JSON.stringify(SYNC.pending)); }
function markPending(id,noFlush){
  if(!SYNC.url || SYNC.local) return;
  SYNC.pending[id]=1; savePending(); setSyncState();
  if(!noFlush) scheduleFlush();
}
var flushTimer=null;
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer=setTimeout(flush, ms==null?1200:ms); }
function api(payload){
  payload.key=SYNC.key;
  return fetch(SYNC.url,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){
      if(j && j.ok===false && j.error==="key"){ SYNC.key=""; lsSet("hoiku_sync_key",null); setSyncState(); openKey("合言葉が変わったか、ちがっています。もう一度入れてください。"); throw new Error("key"); }
      if(!j || j.ok===false) throw new Error((j&&j.message)||"error");
      return j;
    });
}
function infoOf(id){ var f=FMAP[id], s=SMAP[stageOf(id)]; return {ku:f.ku,name:f.name,step:s.step>=0?s.step:"×",stage:s.label}; }
function flush(){
  if(!syncOn() || SYNC.busy) return;
  var ids=pendingIds().filter(function(id){return FMAP[id];});
  if(!ids.length){ setSyncState(); return; }
  if(navigator.onLine===false){ setSyncState(); return; }
  SYNC.busy=true; setSyncState();
  var batch=ids.slice(0,80), sent={};
  var items=batch.map(function(id){ var r=JSON.parse(JSON.stringify(recOf(id))); if(!r.ts) r.ts=1; sent[id]=r.ts; return {id:id,rec:r,info:infoOf(id)}; });
  api({action:"push",who:SYNC.name,total:F.length,items:items}).then(function(j){
    var lost=0;
    (j.accepted||[]).forEach(function(id){ if((recOf(id).ts||1)===sent[id]) delete SYNC.pending[id]; });
    Object.keys(j.rejected||{}).forEach(function(id){
      if((recOf(id).ts||1)!==sent[id]) return;      // 送っている間にまた直した → 次で送る
      var s=j.rejected[id]; if((s.ts||0)>(sent[id]||0)) lost++;
      REC[id]=s; delete SYNC.pending[id]; repaint(id);
    });
    savePending(); saveREC(); okNow();
    if(lost){ render(); toast("ほかの人の新しい記録があったので、そちらを表示しました（"+lost+"園）"); }
    SYNC.busy=false; setSyncState();
    if(pendingIds().length) scheduleFlush(300);
  }).catch(function(e){
    SYNC.busy=false; SYNC.err=String(e&&e.message||e); setSyncState("err");
    if(e&&e.message!=="key") scheduleFlush(30000);
  });
}
function pull(){
  if(!syncOn() || SYNC.busy || navigator.onLine===false) { setSyncState(); return Promise.resolve(); }
  SYNC.busy=true; setSyncState();
  return api({action:"pull"}).then(function(j){
    var recs=j.records||{}, changed=0;
    Object.keys(recs).forEach(function(id){
      if(!FMAP[id]) return; var s=recs[id], l=REC[id];
      if(SYNC.pending[id] && l && (l.ts||0)>(s.ts||0)) return;     // こちらの未送信のほうが新しい
      if(!l || (s.ts||0)>(l.ts||0)){ REC[id]=s; delete SYNC.pending[id]; changed++; repaint(id); }
    });
    // シートにまだない記録（共有を始める前にこの端末でつけた記録・最初からの初期値）を送る
    Object.keys(REC).forEach(function(id){ if(FMAP[id] && (!recs[id] || (REC[id].ts||0)>(recs[id].ts||0))) SYNC.pending[id]=1; });
    F.forEach(function(f){ if(f.seed && !REC[f.id] && !recs[f.id]) SYNC.pending[f.id]=1; });
    savePending(); if(changed) saveREC();
    SYNC.busy=false; okNow();
    if(changed){ render(); if(activeId && !isTyping()) openDetail(activeId,false); }
    if(pendingIds().length) scheduleFlush(200);
  }).catch(function(e){ SYNC.busy=false; SYNC.err=String(e&&e.message||e); setSyncState("err"); });
}
function isTyping(){ var a=document.activeElement; return a && $('detail').contains(a) && /INPUT|TEXTAREA/.test(a.tagName); }
function repaint(id){ var m=markers[id]; if(m){ m.setIcon(iconFor(id)); m.setZIndexOffset(zOf(id)); } }
function okNow(){ SYNC.err=""; SYNC.lastOk=now(); lsSet("hoiku_sync_last",SYNC.lastOk); setSyncState(); }
function setSyncState(force){
  var n=pendingIds().length, st, txt;
  if(!SYNC.url || SYNC.local){ st="off"; txt="📱 端末のみ"; }
  else if(!SYNC.key){ st="warn"; txt="🔑 合言葉"; }
  else if(SYNC.busy){ st="busy"; txt="🔄 同期中…"; }
  else if(navigator.onLine===false){ st="warn"; txt="📴 オフライン"+(n?"・未送信 "+n:""); }
  else if(force==="err"||SYNC.err){ st="err"; txt="⚠ つながりません"+(n?"・未送信 "+n:""); }
  else if(n){ st="warn"; txt="⏳ 未送信 "+n; }
  else { st="ok"; txt="☁ 共有中"; }
  SYNC.state=st;
  var c=$('syncChip'); if(c){ c.textContent=txt; c.className="syncChip s-"+st; }
}
/* 合言葉の画面 */
function openKey(msg){
  $('kMsg').textContent=msg||""; $('kMsg').style.display=msg?"block":"none";
  $('kName').value=SYNC.name; $('kKey').value=SYNC.key;
  openMask('kMask'); setTimeout(function(){ (SYNC.name?$('kKey'):$('kName')).focus(); },120);
}
$('kGo').addEventListener('click',function(){
  var name=$('kName').value.trim(), key=$('kKey').value.trim();
  if(!name){ $('kMsg').textContent="名前を入れてください（履歴に「だれが記録したか」として残ります）"; $('kMsg').style.display="block"; return; }
  if(!key){ $('kMsg').textContent="合言葉を入れてください"; $('kMsg').style.display="block"; return; }
  var b=this; b.disabled=true; b.textContent="確認しています…";
  var oldKey=SYNC.key; SYNC.key=key;
  api({action:"ping"}).then(function(){
    SYNC.name=name; SYNC.local=false; lsSet("hoiku_sync_key",key); lsSet("hoiku_sync_name",name); lsSet("hoiku_sync_local",null);
    closeMask('kMask'); toast("つながりました。記録はチームで共有されます"); okNow(); pull();
  }).catch(function(e){
    SYNC.key=oldKey;
    $('kMsg').textContent=(e&&e.message==="key")?"合言葉がちがいます":"つながりませんでした（電波・URLを確認してください）："+(e&&e.message||"");
    $('kMsg').style.display="block"; openMask('kMask');
  }).then(function(){ b.disabled=false; b.textContent="つなぐ"; });
});
$('kKey').addEventListener('keydown',function(e){ if(e.key==="Enter") $('kGo').click(); });
$('kLocal').addEventListener('click',function(){
  SYNC.local=true; lsSet("hoiku_sync_local","1"); closeMask('kMask'); setSyncState();
  toast("この端末だけで記録します（ⓘからいつでも共有に切り替えられます）");
});
$('syncChip').addEventListener('click',function(){
  if(!SYNC.url){ fillInfo(); openMask('iMask'); return; }
  if(SYNC.local || !SYNC.key){ openKey(); return; }
  if(pendingIds().length) flush(); else pull();
  toast(SYNC.lastOk?"最後に同期："+SYNC.lastOk:"同期しています");
});
window.addEventListener('online',function(){ setSyncState(); flush(); setTimeout(pull,1500); });
window.addEventListener('offline',function(){ setSyncState(); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden){ if(pendingIds().length) flush(); pull(); } });
setInterval(function(){ if(!document.hidden){ if(pendingIds().length) flush(); else pull(); } },90000);
window.addEventListener('pagehide',function(){
  // 閉じる直前の未送信分（届かなくても、次に開いたときにまた送ります）
  if(!syncOn() || !pendingIds().length || !navigator.sendBeacon) return;
  try{
    var items=pendingIds().slice(0,40).map(function(id){ return {id:id,rec:recOf(id),info:infoOf(id)}; });
    navigator.sendBeacon(SYNC.url,new Blob([JSON.stringify({key:SYNC.key,action:"push",who:SYNC.name,total:F.length,items:items})],{type:"text/plain;charset=utf-8"}));
  }catch(e){}
});

/* ========== ボトムシート（スマホ）：神社マップと同じ操作 ========== */
(function(){
  var side=$('side'), handle=$('sheetHandle');
  function snaps(){ var vh=window.innerHeight; return [vh*0.2, vh*0.46, vh*0.86]; }
  function FULL(){ return snaps()[2]; }
  function curH(){ return side.getBoundingClientRect().height; }
  function setH(h){ var vh=window.innerHeight; h=Math.max(vh*0.12,Math.min(vh*0.9,h)); side.style.height=h+'px'; }
  function nearest(h){ var sn=snaps(); return sn.reduce(function(p,c){return Math.abs(c-h)<Math.abs(p-h)?c:p;}); }
  function animTo(h){ side.style.transition='height .2s cubic-bezier(.3,.7,.3,1)'; setH(h); setTimeout(function(){side.style.transition='';},220); }
  function setStick(){
    if(window.innerWidth>820) return;
    var h=handle.offsetHeight, b=side.querySelector('.brand').offsetHeight;
    document.documentElement.style.setProperty('--stH',h+'px'); document.documentElement.style.setProperty('--stB',(h+b)+'px');
  }
  var active=false, mode=null, startY=0, startH=0, moved=false, couple=false, onHandle=false, i0=0, lastY=0, lastT=0, vy=0;
  function start(y,target){
    active=true; mode=null; moved=false; startY=y; startH=curH(); side.style.transition='';
    i0=snaps().indexOf(nearest(startH)); lastY=y; lastT=performance.now(); vy=0;
    var sticky=!!(target&&target.closest&&(target.closest('#sheetHandle')||target.closest('.brand')||target.closest('.tabs')));
    couple=!sticky; onHandle=!!(target&&target.closest&&target.closest('#sheetHandle'));
  }
  function move(y,ev){
    if(!active) return;
    var dy=y-startY, t=performance.now(), dt=t-lastT; if(dt>0) vy=(y-lastY)/dt; lastY=y; lastT=t;
    if(mode===null){
      if(Math.abs(dy)<3) return; moved=true;
      if(!couple) mode='sheet';
      else { var expandable=curH()<FULL()-2, atTop=side.scrollTop<=0;
        if(dy<0&&expandable) mode='sheet'; else if(dy>0&&atTop) mode='sheet'; else mode='scroll'; }
    }
    if(mode==='sheet'){ if(ev&&ev.cancelable) ev.preventDefault(); setH(startH-dy*1.4); }
  }
  function end(){
    if(!active) return; active=false;
    if(!moved&&onHandle){ var sn=snaps(), i=sn.indexOf(nearest(curH())); animTo(sn[(i+1)%sn.length]); mode=null; return; }
    if(mode==='sheet'){
      var s2=snaps(), ni=s2.indexOf(nearest(curH())), dir=Math.sign(curH()-startH), disp=Math.abs(curH()-startH), fast=Math.abs(vy)>0.35;
      if(ni===i0&&dir!==0&&(disp>8||fast)) ni=Math.max(0,Math.min(s2.length-1,i0+dir));
      animTo(s2[ni]);
    }
    mode=null;
  }
  side.addEventListener('touchstart',function(e){ start(e.touches[0].clientY,e.target); },{passive:true});
  side.addEventListener('touchmove',function(e){ move(e.touches[0].clientY,e); },{passive:false});
  side.addEventListener('touchend',end); side.addEventListener('touchcancel',end);
  handle.addEventListener('pointerdown',function(e){ if(e.pointerType==='mouse'){ start(e.clientY,handle); handle.setPointerCapture(e.pointerId); } });
  handle.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse') move(e.clientY,e); });
  handle.addEventListener('pointerup',function(e){ if(e.pointerType==='mouse') end(); });
  window.addEventListener('resize',function(){ if(window.innerWidth>820) side.style.height=''; setStick(); });
  setStick();
  // 地図を動かしたらシートを低くして地図を広く
  map.on('dragstart',function(){ if(window.innerWidth<=820 && curH()>snaps()[1]+4) animTo(snaps()[1]); });
})();

/* ========== 起動 ========== */
if(!tabList("next").length) state.tab = tabList("prog").length ? "prog" : "all";
render();
setSyncState();
if(SYNC.url && !SYNC.local){ if(SYNC.key) pull(); else setTimeout(function(){ openKey(); },400); }
try{ if(!localStorage.getItem("hoiku_seen")){ localStorage.setItem("hoiku_seen","1"); setTimeout(function(){ toast("ピンをタップ → 電話・記録。🔍で絞り込み"); },800); } }catch(e){}
})();
